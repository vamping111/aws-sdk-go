name: Bump version in the provider

on:
  release:
    types:
      - published

jobs:
  bump-version:
    runs-on: ubuntu-22.04
    environment: provider-writer
    steps:
      - name: Setup Go
        uses: actions/setup-go@v2
        with:
          go-version: 1.21.x

      - name: Create provider-only GitHub App token
        id: app-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PEM }}
          owner: C2Devel
          repositories: terraform-provider-rockitcloud
          permission-contents: write

      - uses: actions/checkout@v4
        with:
          ref: develop
          repository: C2Devel/terraform-provider-rockitcloud
          token: ${{ steps.app-token.outputs.token }}

      - name: Set release number
        run: |
          echo "LATEST_RELEASE=$(curl --silent https://api.github.com/repos/C2Devel/aws-sdk-go/releases/latest |\
          jq -r .name)" >> $GITHUB_ENV

      - name: Bump version in go.mod
        run: |
          go mod edit \
          -replace github.com/aws/aws-sdk-go=github.com/C2Devel/aws-sdk-go@${{ env.LATEST_RELEASE }}

      - name: Update dependencies
        run: |
          go mod tidy

      - name: Commit and push directly to provider develop
        run: |
          if git diff --quiet -- go.mod go.sum; then
            echo "Provider already uses ${{ env.LATEST_RELEASE }}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          git commit -m "bump aws-sdk-go version"
          git push origin HEAD:develop

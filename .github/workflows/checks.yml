name: Run unit tests for the code

on:
  pull_request:
    branches: 'develop'

jobs:
  code-linter:
    runs-on: ubuntu-22.04
    steps:
    - name: Setup Go
      uses: actions/setup-go@v2
      with:
        go-version: 1.21.x

    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Install tools
      run: make install-deps-verify

    - name: Run linters for the code
      run: make all
